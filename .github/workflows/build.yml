name: Build brkh linux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mirrors
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' >> /etc/pacman.d/mirrorlist

      - name: Install archiso
        run: pacman -Sy --noconfirm archiso

      - name: Set up build profile
        run: |
          mkdir -p /build
          cp -r /usr/share/archiso/configs/baseline/. /build/
          sed -i 's/iso_name="archlinux"/iso_name="brkh-linux"/' /build/profiledef.sh
          sed -i 's/iso_publisher="Arch Linux <https:\/\/archlinux.org>"/iso_publisher="brkh"/' /build/profiledef.sh
          sed -i "s/airootfs_image_tool_options=.*/airootfs_image_tool_options=('-comp' 'zstd' '-Xcompression-level' '15')/" /build/profiledef.sh
          sed -i 's/SigLevel    = Required DatabaseOptional/SigLevel = Never/' /build/pacman.conf
          echo "brkh" > /build/airootfs/etc/hostname

      - name: Build ISO
        run: mkarchiso -v -w /tmp/work -o /output /build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: brkh-linux-iso
          path: /output/*.iso
          retention-days: 7
