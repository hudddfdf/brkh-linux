general {
    colors = true
    interval = 2
    color_good     = "#00ffcc"
    color_degraded = "#ffcc00"
    color_bad      = "#ff4444"
}

order += "ethernet _first_"
order += "wireless _first_"
order += "cpu_usage"
order += "memory"
order += "disk /"
order += "tztime local"

wireless _first_ {
    format_up   = "  %essid %quality"
    format_down = "  down"
}

ethernet _first_ {
    format_up   = "  %ip"
    format_down = "  down"
}

cpu_usage {
    format = " CPU: %usage"
}

memory {
    format = " MEM: %used/%total"
    threshold_degraded = "10%"
}

disk "/" {
    format = " DISK: %avail"
}

tztime local {
    format = " %Y-%m-%d %H:%M"
}
